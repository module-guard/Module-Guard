[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-module-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["checkov: executes the real Checkov binary", "postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv-checkov"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
